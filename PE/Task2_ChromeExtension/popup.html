<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-check">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="brand-title">Tasks</span>
      </div>

      <div class="header-right">
        <span id="task-counter" class="counter">0 left</span>
        <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="theme-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-sun" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Minimal Add Task Input -->
    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" autofocus>
        <button id="add-btn" class="add-btn" title="Add task">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Quick category pills -->
      <div class="category-pills">
        <button type="button" class="pill active" data-cat="General">General</button>
        <button type="button" class="pill" data-cat="College">College</button>
        <button type="button" class="pill" data-cat="Coding">Coding</button>
        <button type="button" class="pill" data-cat="Personal">Personal</button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="active">Active</button>
        <button class="tab-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clear-btn" class="text-action-btn">Clear done</button>
    </div>

    <!-- Tasks List -->
    <div class="tasks-scroll-area">
      <ul id="task-list" class="task-list"></ul>
      
      <div id="empty-state" class="empty-state hidden">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <p>All caught up!</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
